<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ogün Babacan</title>
<meta name="description" content="Ogün Babacan — developing stuff at Trendyol GO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,800;1,400&display=swap" rel="stylesheet">
<script>
  // black and white: ink on paper or light on dark, and every tap flips one into the other.
  // ac is for links, a step past the text so they lift off everything else
  window.palette = inv => inv
    ? { bg: '#f1f1ee', fg: '#1b1b1b', ac: '#000' }
    : { bg: '#0b0b0b', fg: '#e4e4e4', ac: '#fff' };
  window.paint = inv => {
    const s = document.documentElement.style, p = palette(inv);
    for (const k in p) s.setProperty('--' + k, p[k]);
    window.inv = inv;
  };
  paint(false);
</script>
<style>
  :root {
    --bg: #0c0c0c;
    --fg: #ececec;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* taps only: no pinch-zoom, scroll or text selection fighting the canvas */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body { height: 100dvh; cursor: crosshair; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* everything visible is drawn on the canvas; this copy is for screen readers and search */
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* real, focusable links laid exactly over their canvas glyphs */
  .hit {
    position: fixed;
    color: transparent;
    text-decoration: none;
    outline: none;
    cursor: pointer;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<main class="sr">
  <h1>Ogün Babacan</h1>
  <p>developing stuff at Trendyol GO</p>
  <p>Istanbul, Turkey</p>
</main>

<nav aria-label="Links">
  <a class="hit" href="https://github.com/Trendyol" target="_blank" rel="noopener">Trendyol GO</a>
  <a class="hit" href="https://github.com/ogunb" target="_blank" rel="noopener">GitHub</a>
  <a class="hit" href="https://www.linkedin.com/in/ogunbabacan" target="_blank" rel="noopener">LinkedIn</a>
  <a class="hit" href="mailto:babacanogun@gmail.com">Email</a>
</nav>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const links = [...document.querySelectorAll('.hit')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;   // phones and tablets

  const MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  const NAME = 'Ogün Babacan';
  const SIDE = ' :::-...';                   // banner extrusion, nearest layer first (index 0 unused)
  // every glyph is drawn in one of these: the background's three brightnesses, then the small text's
  // voices (w: b bold, i italic; c: palette colour). Text keys are named for put()
  const STYLES = [
    { a: coarse ? 0.18 : 0.2 }, { a: 0.55 }, { a: 1 },
    { a: 1, w: 'b' },               // 3 head: what matters in a line
    { a: 0.6, w: 'i' },             // 4 aside: the words around it
    { a: 0.38 },                    // 5 rule: numbers and punctuation
    { a: 1, w: 'b', c: 'ac' }       // 6 link
  ];
  const HEAD = 3, ASIDE = 4, RULE = 5, LINK = 6;
  const SS = 2;                               // banner mask samples per cell
  const DEPTH = 7;                            // extrusion layers
  const LANE = 3.4;                           // rows between streamlines
  const ROCK = 0.11;                          // radius of the rock under the pointer, in screen heights
  const SPEED = 900;                          // px/s: the ripple front and the colour reveal travel together
  const LX = -0.45, LY = -0.55, LZ = 0.7;     // light from the top left
  // phones run hot at 60 fps on a full-screen canvas; 30 is plenty there
  const FRAME_MS = coarse ? 1000 / 30 : 0;
  const MAX_WAVES = coarse ? 3 : 5;
  const MAX_REVEALS = 4;
  const TAP_GAP_MS = 120;                     // rapid multi-finger taps are folded together
  const SCENE_SECS = 9;                       // how long each background plays before the next
  const FADE_SECS = 1.4;                      // the dissolve between two backgrounds

  let pal = palette(inv);
  let W, H, unit, cw, ch, cols, rows, fonts;
  let textGrid, styleGrid, hitGrid, mask, calm, thr, mW, mH, Hall, Hwave, Q, clockAt, labelAt;
  // per-column and per-row terms (swell, and positions in screen heights), refreshed every frame
  let colX, colS, rowY, rowS;

  /* ---------- layout: everything snaps to the character grid ---------- */
  const maskAt = (u, v) => {
    const mi = Math.floor(u * SS), mj = Math.floor(v * SS);
    return mi >= 0 && mj >= 0 && mi < mW && mj < mH && mask[mj * mW + mi] === 1;
  };

  // writes text into the grid inside a blank halo, so the river never crowds it
  function put(str, c, r, style = HEAD, link = -1) {
    for (let rr = r - 1; rr <= r + 1; rr++) {
      if (rr < 0 || rr >= rows) continue;
      for (let k = -1; k <= str.length; k++) {
        const cc = c + k;
        if (cc < 0 || cc >= cols) continue;
        const idx = rr * cols + cc;
        if (rr === r && k >= 0 && k < str.length) {
          textGrid[idx] = str[k];
          styleGrid[idx] = style;
          hitGrid[idx] = link;
        } else if (textGrid[idx] === null) {
          textGrid[idx] = ' ';
        }
      }
    }
    return c + str.length;
  }

  // a line in several voices, e.g. [['istanbul ', ASIDE], ['01:21', HEAD]]; returns the column after it
  const putLine = (parts, c, r) => parts.reduce((cc, [str, style]) => put(str, cc, r, style), c);
  const lineLength = parts => parts.reduce((n, [str]) => n + str.length, 0);

  function placeLink(i, label, c, r) {
    put(label, c, r, LINK, i);
    // on touch screens the target reaches into the blank halo above and below, for a fingertip
    const grow = coarse ? ch * 0.75 : 0;
    Object.assign(links[i].style, {
      left: c * cw + 'px', top: r * ch - grow + 'px', width: label.length * cw + 'px', height: ch + 2 * grow + 'px'
    });
  }

  const time = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Istanbul', hour12: false });
  // hours and minutes carry the line; the seconds tick by quietly
  const clock = () => { const t = time(); return [['istanbul ', ASIDE], [t.slice(0, 5), HEAD], [t.slice(5), RULE]]; };
  const tick = () => { if (clockAt) putLine(clock(), clockAt.c, clockAt.r); };
  setInterval(tick, 1000);

  function layout() {
    // a page can report a 0×0 viewport for a moment (backgrounded tabs, some mobile reloads)
    if (!innerWidth || !innerHeight) { setTimeout(layout, 100); return; }
    W = innerWidth; H = innerHeight; unit = Math.min(W, H);
    const dpr = Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fs = W < 640 ? 14 : 13;   // phones get the larger grid: fewer, more legible cells
    const reg = `${fs}px ${MONO}`;
    fonts = STYLES.map(st => st.w === 'b' ? `800 ${fs}px ${MONO}` : st.w === 'i' ? `italic ${fs}px ${MONO}` : reg);
    ctx.font = reg;
    ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width;   // exact advance, so a row drawn as one string lines up with the cells
    ch = Math.round(fs * 1.3);
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);

    const n = cols * rows;
    textGrid = new Array(n).fill(null);
    styleGrid = new Uint8Array(n);
    hitGrid = new Int8Array(n).fill(-1);
    Hall = new Float32Array(n);
    Hwave = new Float32Array(n);
    Q = new Float32Array(n);
    colX = new Float32Array(cols); colS = new Float32Array(cols);
    rowY = new Float32Array(rows); rowS = new Float32Array(rows);
    bufs = Array.from({ length: MAX_REVEALS + 1 }, () => STYLES.map(() => new Array(cols).fill(' ')));
    used = Array.from({ length: MAX_REVEALS + 1 }, () => STYLES.map(() => 0));

    const pad = Math.min(44, Math.max(16, W * 0.032));
    const mx = Math.max(2, Math.round(pad / cw)), my = Math.max(1, Math.round(pad / ch));

    // the name, rasterised once into a mask at 2×2 samples per cell. When stacked (narrow or tall
    // screens) the letters are condensed, so width stops being the limit and they can be twice as tall
    const lines = cols >= 72 && W / H > 1.25 ? [NAME] : NAME.split(' ');
    const squeeze = lines.length > 1 ? 0.5 : 1;
    const mc = document.createElement('canvas');
    mW = cols * SS; mH = rows * SS;
    mc.width = mW; mc.height = mH;
    const m = mc.getContext('2d', { willReadFrequently: true });
    m.font = `800 100px ${MONO}`;
    const widest = Math.max(...lines.map(l => m.measureText(l).width)) * squeeze;
    const F = Math.min(100 * (W - 2 * mx * cw - 2 * cw) / widest, H * 0.4 / lines.length, 260);
    m.setTransform(SS / cw * squeeze, 0, 0, SS / ch, 0, 0);
    m.font = `800 ${F}px ${MONO}`;
    m.fillStyle = '#fff';
    const lh = F * 0.95;
    const top = H * 0.42 - lines.length * lh / 2;
    lines.forEach((l, k) => m.fillText(l, mx * cw / squeeze, top + k * lh + F * 0.78));
    const px = m.getImageData(0, 0, mW, mH).data;
    mask = new Uint8Array(mW * mH);
    for (let i = 0; i < mask.length; i++) mask[i] = px[i * 4 + 3] > 110 ? 1 : 0;

    // calm water round the name, two cells either side and one above and below, so it reads cleanly
    calm = new Uint8Array(n);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        if (!maskAt(i + 0.25, j + 0.25) && !maskAt(i + 0.75, j + 0.25) && !maskAt(i + 0.25, j + 0.75) && !maskAt(i + 0.75, j + 0.75)) continue;
        for (let jj = Math.max(0, j - 1); jj <= Math.min(rows - 1, j + 1); jj++) {
          for (let ii = Math.max(0, i - 2); ii <= Math.min(cols - 1, i + 2); ii++) calm[jj * cols + ii] = 1;
        }
      }
    }

    // small text
    labelAt = { c: mx, r: my };
    label();
    clockAt = { c: cols - mx - lineLength(clock()), r: my };
    tick();
    const roleRow = Math.min(rows - my - 4, Math.ceil((top + lines.length * lh) / ch) + 2);
    placeLink(0, 'Trendyol GO', put('developing stuff at ', mx, roleRow, ASIDE), roleRow);
    const lr = rows - 1 - my;
    let c = mx;
    ['github', 'linkedin', 'email'].forEach((label, k) => {
      c = put(`0${k + 1} `, c, lr, RULE);
      placeLink(k + 1, label, c, lr);
      c += label.length + 4;
    });
    const hint = coarse ? 'tap anywhere' : 'click anywhere';
    if (cols - mx - hint.length > c + 2) put(hint, cols - mx - hint.length, lr, ASIDE);

    // the order cells switch in during a dissolve: a diagonal sweep, broken up by noise
    thr = new Float32Array(n);
    for (let j = 0, idx = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++, idx++) thr[idx] = 0.6 * (0.6 * i / cols + 0.4 * j / rows) + 0.38 * hash(i, j);
    }
    for (const sc of Object.values(SCENES)) sc.layout?.();
  }

  /* ---------- backgrounds ---------- */
  // Every scene draws only the cells the name and text leave free. cell() returns a glyph and sets
  // `cb`, its brightness (0 dim, 1 mid, 2 bright). Scenes other than the river look through the
  // surface, so ripples refract them: they sample the cell the surface slope points at.
  const hash = (i, j) => { const h = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return h - Math.floor(h); };
  const RAMP = ' .:-=+*#%@';
  let cb = 0;
  const refrI = (i, gx) => Math.min(cols - 1, Math.max(0, Math.round(i - gx * 40 / cw)));
  const refrJ = (j, gy) => Math.min(rows - 1, Math.max(0, Math.round(j - gy * 40 / ch)));
  const glint = spec => spec > 0.12 ? 2 : spec > 0.04 ? 1 : 0;

  const river = {
    // a stream function, so its level lines are the paths the water takes. Slow meanders pinch and
    // widen the lanes, the pointer is a rock the flow parts around (potential flow past a cylinder),
    // and ripples push the lanes about. Q is in lanes, one per LANE rows
    prep() {
      const lanes = rows / LANE;
      const rx = (mouse.x - W / 2) / H, ry = (mouse.y - H / 2) / H, rock = mouse.s * ROCK * ROCK;
      for (let j = 0, idx = 0; j < rows; j++) {
        const y = rowY[j];
        for (let i = 0; i < cols; i++, idx++) {
          const x = colX[i];
          let psi = y + 0.055 * Math.sin(x * 3.6 - now * 0.18 + y * 2.2) + 0.025 * Math.sin(x * 8.3 + now * 0.11 - y * 3.1);
          if (rock > 1e-5) {
            const dx = x - rx, dy = y - ry;
            psi -= dy * Math.min(1, rock / (dx * dx + dy * dy));
            // a wake: the lanes behind the rock shiver, fading downstream
            if (dx > 0) psi += mouse.s * 0.35 / lanes * Math.sin(dx * 38 - now * 5) * Math.exp(-dx * 5 - dy * dy / (rock * 2.5));
          }
          Q[idx] = psi * lanes + (waves.length ? Hwave[idx] * 0.12 : 0);
        }
      }
      this.rockX = mouse.x; this.rockY = mouse.y; this.rockR2 = (mouse.s * ROCK * H) ** 2;
    },
    cell(i, j, idx, px, py, spec, l, r, u, d) {
      // a streamline passes through this cell if its lane is within half a cell along the steeper
      // axis (one glyph thick), drawn with the glyph closest to its direction
      const q = Q[idx], qi = (Q[r] - Q[l]) / 2, qj = (Q[d] - Q[u]) / 2;
      const lvl = Math.round(q), ai = Math.abs(qi), aj = Math.abs(qj);
      const dxr = px - this.rockX, dyr = py - this.rockY, rr = (dxr * dxr + dyr * dyr) / this.rockR2;
      const inRock = rr < 1, nearRock = rr < 9;
      // every lane carries dashes of current downstream, at its own speed and spacing; by the rock
      // they run unbroken, so the bend reads
      const v = 55 + 35 * Math.sin(lvl * 2.39), P = 150 + 90 * (0.5 + 0.5 * Math.sin(lvl * 1.37));
      const seg = ((px - now * v + lvl * 97) % P + P) % P;
      if (inRock) {
        // foam churning round the rim, heaviest where the water strikes it
        const h = Math.sin(i * 12.9898 + j * 78.233 + Math.floor(now * 9) * 3.17) * 43758.5453;
        if (rr > 0.55 && h - Math.floor(h) < (dxr < 0 ? 0.7 : 0.35)) {
          cb = dxr < 0 ? 2 : 1;
          return rr > 0.8 ? '~' : '°';
        }
        return ' ';
      }
      if (Math.abs(q - lvl) < 0.5 * Math.max(ai, aj) && (nearRock || seg < P * 0.72)) {
        // the leading end of a dash, and water squeezed past the rock, catch the light
        const head = seg > P * 0.72 - 2 * cw, rapid = Math.max(ai, aj) > 0.5 / LANE * 1.7;
        cb = Math.min(2, (head ? 1 : 0) + (rapid ? 1 : 0) + (spec > 0.1 ? 2 : spec > 0.03 ? 1 : 0));
        if (ai < aj * 0.6) {
          // flat runs: pick the glyph by where in the cell the line sits, so slopes step smoothly
          const off = (lvl - q) / qj;
          return off > 0.2 ? '_' : off < -0.2 ? '¯' : '-';
        }
        return aj < ai * 0.42 ? '|' : qi * qj > 0 ? '/' : '\\';
      }
      // flecks drifting with the current
      return hash(Math.floor((px - now * 48) / cw), j) < 0.012 ? '.' : ' ';
    }
  };

  // the original: two interfering sine sheets, sharpened so most of it is dark
  const sea = {
    layout() {
      this.ca = new Float32Array(cols); this.cb = new Float32Array(cols);
      this.ra = new Float32Array(rows); this.rb = new Float32Array(rows);
    },
    prep() {
      for (let i = 0; i < cols; i++) { const x = colX[i]; this.ca[i] = x * 4.2 + now * 0.35; this.cb[i] = 1.5 * Math.sin(x * 2.6 + now * 0.2); }
      for (let j = 0; j < rows; j++) { const y = rowY[j]; this.ra[j] = 2 * Math.sin(y * 3.1 - now * 0.25); this.rb[j] = y * 5.0 - now * 0.30; }
    },
    cell(i, j, idx, px, py, spec, l, r, u, d, gx, gy) {
      const si = refrI(i, gx), sj = refrJ(j, gy);
      let v = Math.sin(this.ca[si] + this.ra[sj]) * Math.sin(this.rb[sj] + this.cb[si]) * 0.5 + 0.5;
      v = v * v * v * v * 0.8 + Math.max(0, spec) * 2.2;
      cb = glint(spec);
      return RAMP[Math.max(0, Math.min(9, Math.floor(v * 10)))];
    }
  };

  // a retro sunset: striped sun behind a mountain ridge, a perspective grid floor running at you
  const terrain = {
    layout() {
      this.hy = Math.round(rows * 0.6);
      this.z = new Float32Array(rows + 1);
      for (let j = this.hy + 1; j <= rows; j++) this.z[j] = (rows - this.hy) / (j - this.hy + 0.5);
      this.m = new Float32Array(cols);
      for (let i = 0; i < cols; i++) {
        const x = ((i + 0.5) * cw - W / 2) / H;
        this.m[i] = rows * 0.13 * (0.55 + 0.25 * Math.sin(x * 9.1 + 2) + 0.2 * Math.sin(x * 23.7 + 1));
      }
    },
    prep() {
      this.cx = W / 2 - tiltX * W * 0.08;
      this.cy = (this.hy - rows * 0.11) * ch;
      this.R = unit * 0.17;
      this.scroll = now * 2.2;
      this.lean = tiltX * 0.2;
    },
    cell(i, j, idx, px, py, spec, l, r, u, d, gx, gy) {
      const si = refrI(i, gx), sj = refrJ(j, gy), hy = this.hy;
      if (sj > hy) {
        // a grid line crosses this cell if the floor coordinate rolls over between neighbouring cells
        const z = this.z[sj], zn = this.z[sj + 1] || z;
        const Z = z + this.scroll, Zn = zn + this.scroll;
        const X = (colX[si] + this.lean) * z * 7, Xn = ((si + 1 < cols ? colX[si + 1] : colX[si]) + this.lean) * z * 7;
        const hl = Math.floor(Z) !== Math.floor(Zn), vl = Math.floor(X) !== Math.floor(Xn);
        cb = Math.max(glint(spec), z < 2.2 ? 1 : 0);
        if (hl && vl) return '+';
        if (hl) return '-';
        if (vl) return Math.abs(X) < z * 0.35 ? '|' : X < 0 ? '/' : '\\';
        return spec > 0.06 ? '.' : ' ';
      }
      if (sj === hy) { cb = 1; return '='; }
      const up = hy - sj, m = this.m[si];
      if (up < m) {
        // only the ridge is drawn, sloped to match its neighbours
        if (up < m - 1) return ' ';
        const a = si > 0 ? this.m[si - 1] : m, b = si + 1 < cols ? this.m[si + 1] : m;
        cb = 1;
        return a < m - 0.5 && b < m - 0.5 ? '^' : a < b ? '/' : b < a ? '\\' : '-';
      }
      const dx = px - this.cx, dy = py - this.cy;
      if (dx * dx + dy * dy < this.R * this.R) {
        // the sun's slits widen toward the horizon
        const k = (dy + this.R) / (2 * this.R);
        if (k > 0.45 && j % (k > 0.75 ? 2 : 3) === 0) return ' ';
        cb = 1;
        return '=';
      }
      const h = hash(si, sj);
      if (h > 0.992) { cb = Math.sin(now * 2 + h * 900) > 0.6 ? 1 : 0; return h > 0.997 ? '*' : '.'; }
      return ' ';
    }
  };

  // a warp: stars stream out of a vanishing point that follows the pointer
  const stars = {
    layout() {
      const N = Math.min(520, Math.floor(cols * rows / 12));
      this.x = new Float32Array(N); this.y = new Float32Array(N); this.z = new Float32Array(N);
      for (let k = 0; k < N; k++) this.spawn(k, 0.1 + 0.9 * Math.random());
      this.g = new Float32Array(cols * rows);
    },
    spawn(k, z) { this.x[k] = Math.random() * 2 - 1; this.y[k] = Math.random() * 2 - 1; this.z[k] = z; },
    plot(px, py, v) {
      const i = Math.floor(px / cw), j = Math.floor(py / ch);
      if (i >= 0 && j >= 0 && i < cols && j < rows && v > this.g[j * cols + i]) this.g[j * cols + i] = v;
    },
    prep(dt) {
      this.g.fill(0);
      const vx = W / 2 + tiltX * W * 0.5, vy = H / 2 + tiltY * H * 0.5, s = unit * 0.45;
      for (let k = 0; k < this.z.length; k++) {
        const z = this.z[k] - dt * 0.32;
        if (z < 0.04) { this.spawn(k, 1); continue; }
        this.z[k] = z;
        const px = vx + this.x[k] / z * s, py = vy + this.y[k] / z * s;
        if (px < 0 || py < 0 || px > W || py > H) { this.spawn(k, 1); continue; }
        const v = Math.min(1, (1 - z) * 1.25);
        this.plot(px, py, v);
        // a short streak back toward the vanishing point, longer as the star closes in
        const z2 = z + 0.06;
        this.plot(vx + this.x[k] / z2 * s, vy + this.y[k] / z2 * s, v * 0.45);
      }
    },
    cell(i, j, idx, px, py, spec, l, r, u, d, gx, gy) {
      const v = this.g[refrJ(j, gy) * cols + refrI(i, gx)] + Math.max(0, spec) * 1.5;
      cb = v > 0.8 ? 2 : v > 0.45 ? 1 : 0;
      return v > 0.8 ? '@' : v > 0.55 ? '*' : v > 0.3 ? '+' : v > 0.12 ? '.' : ' ';
    }
  };

  // falling columns of characters: near drops bright, long and fast, far ones dim, short and slow
  const GLYPHS = 'abcdefghijklmnopqrstuvwxyz0123456789$+-*/=%#&<>?!';
  const rain = {
    layout() {
      const N = cols * 2;   // two drops share each column
      this.h = new Float32Array(N); this.v = new Float32Array(N); this.len = new Float32Array(N); this.dep = new Float32Array(N);
      for (let k = 0; k < N; k++) this.drop(k, Math.random() * rows * 1.5 - rows * 0.5);
    },
    drop(k, h) {
      const dep = 0.25 + 0.75 * Math.random();
      this.dep[k] = dep; this.h[k] = h; this.v[k] = 6 + 20 * dep; this.len[k] = 3 + 14 * dep;
    },
    prep(dt) {
      for (let k = 0; k < this.h.length; k++) {
        this.h[k] += this.v[k] * dt;
        if (this.h[k] - this.len[k] > rows) this.drop(k, -Math.random() * rows * 0.6);
      }
    },
    cell(i, j, idx, px, py, spec, l, r, u, d, gx, gy) {
      const si = refrI(i, gx), sj = refrJ(j, gy);
      let best = 0, head = false;
      for (let k = si * 2; k < si * 2 + 2; k++) {
        const dd = this.h[k] - sj;
        if (dd < 0 || dd >= this.len[k]) continue;
        const v = this.dep[k] * (dd < 1 ? 1 : 0.8 * (1 - dd / this.len[k]));
        if (v > best) { best = v; head = dd < 1; }
      }
      if (best < 0.08) return spec > 0.08 ? '.' : ' ';
      cb = Math.max(glint(spec), head ? 2 : best > 0.5 ? 1 : 0);
      // each glyph flickers to another now and then
      return GLYPHS[Math.floor(hash(si, Math.floor(now * 7 + si * 0.37 + sj * 0.13)) * GLYPHS.length)];
    }
  };

  const SCENES = { river, sea, terrain, stars, rain };
  const NAMES = Object.keys(SCENES);
  // a different background on every visit, and another every SCENE_SECS while the page is open
  const pick = not => { let n; do n = NAMES[Math.floor(Math.random() * NAMES.length)]; while (n === not); return n; };
  let sceneName = pick(), nextName = null, fadeT0 = 0, sceneUntil = performance.now() / 1000 + SCENE_SECS;
  function label() {
    if (labelAt) putLine([['ogun.dev', HEAD], [' / ', RULE], [(nextName || sceneName).padEnd(7), ASIDE]], labelAt.c, labelAt.r);
  }

  // mobile browsers fire resize as the address bar slides; rebuild once things settle
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });
  let bufs = [], used = [];
  layout();
  if (document.fonts) {
    Promise.all([`800 100px ${MONO}`, `14px ${MONO}`, `italic 14px ${MONO}`]
      .map(f => document.fonts.load(f))).then(layout, () => {});
  }

  /* ---------- input ---------- */
  const mouse = { x: -1e4, y: -1e4, on: 0, s: 0 };
  const waves = [];
  let hover = -1, now = 0, lastTap = -1e9;
  // colour layers: the settled base, then one expanding circle per tap, newest last
  let base = pal;
  const reveals = [];

  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = 1; });
  document.addEventListener('pointerleave', () => { mouse.on = 0; });
  // a lifted finger leaves no hover behind
  const lift = e => { if (e.pointerType !== 'mouse') mouse.on = 0; };
  addEventListener('pointerup', lift);
  addEventListener('pointercancel', lift);
  addEventListener('pointerdown', e => {
    if (e.target.closest?.('a')) return;
    const t = performance.now();
    if (t - lastTap < TAP_GAP_MS) return;
    lastTap = t;
    recolor(e.clientX, e.clientY);
    if (reduced) return;
    waves.push({ x: e.clientX, y: e.clientY, t0: now });
    if (waves.length > MAX_WAVES) waves.shift();
  });

  links.forEach((a, i) => {
    const on = () => { hover = i; }, off = () => { if (hover === i) hover = -1; };
    a.addEventListener('pointerenter', on); a.addEventListener('pointerleave', off);
    a.addEventListener('focus', on); a.addEventListener('blur', off);
  });

  // the flipped palette rides outward on the ripple's leading edge; rapid taps stack, each circle growing over the last
  function recolor(px, py) {
    paint(!inv);
    pal = palette(inv);
    if (reduced) { base = pal; reveals.length = 0; return; }
    reveals.push({ x: px, y: py, t0: now, rad: 0, r: Math.hypot(Math.max(px, W - px), Math.max(py, H - py)), pal });
    if (reveals.length > MAX_REVEALS) base = reveals.shift().pal;
  }

  // index of the colour layer showing at a point: 0 is the base, k + 1 is reveals[k]
  const layerAt = (x, y) => {
    for (let k = reveals.length - 1; k >= 0; k--) {
      const rv = reveals[k];
      if ((x - rv.x) ** 2 + (y - rv.y) ** 2 <= rv.rad * rv.rad) return k + 1;
    }
    return 0;
  };
  const layerPal = n => n ? reveals[n - 1].pal : base;

  /* ---------- render ---------- */
  let last = performance.now(), lastDraw = -1e9, tiltX = 0, tiltY = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    if (!Hall || ms - lastDraw < FRAME_MS - 2) return;
    lastDraw = ms;
    const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000));
    last = ms;
    now += dt * (reduced ? 0.2 : 1);

    mouse.s += (mouse.on - mouse.s) * Math.min(1, dt * 3);
    // the banner leans away from the pointer; without one it slowly orbits on its own
    const tx = mouse.on ? mouse.x / W - 0.5 : 0.35 * Math.cos(now * 0.4);
    const ty = mouse.on ? mouse.y / H - 0.5 : 0.25 * Math.sin(now * 0.4);
    tiltX += (tx - tiltX) * Math.min(1, dt * 4);
    tiltY += (ty - tiltY) * Math.min(1, dt * 4);
    while (waves.length && now - waves[0].t0 > 4) waves.shift();

    // once a circle covers the screen it becomes the base, along with everything under it
    for (const rv of reveals) rv.rad = SPEED * (now - rv.t0);
    for (let k = reveals.length - 1; k >= 0; k--) {
      if (reveals[k].rad > reveals[k].r) { base = reveals[k].pal; reveals.splice(0, k + 1); break; }
    }

    // 0. separable terms: a handful of sines per row and per column instead of per cell
    for (let i = 0; i < cols; i++) {
      const px = (i + 0.5) * cw;
      colX[i] = (px - W / 2) / H;
      colS[i] = Math.sin(px * 0.011 + now * 0.9);
    }
    for (let j = 0; j < rows; j++) {
      const py = (j + 0.5) * ch;
      rowY[j] = (py - H / 2) / H;
      rowS[j] = 6 * Math.sin(py * 0.014 - now * 0.7);
    }

    // 1. height of the surface: idle swell everywhere, then the pointer lens and ripples only where they reach
    for (let j = 0, idx = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++, idx++) Hall[idx] = colS[i] * rowS[j];
    }
    if (mouse.s > 0.01) {
      const R = 280;
      const i0 = Math.max(0, Math.floor((mouse.x - R) / cw)), i1 = Math.min(cols - 1, Math.ceil((mouse.x + R) / cw));
      const j0 = Math.max(0, Math.floor((mouse.y - R) / ch)), j1 = Math.min(rows - 1, Math.ceil((mouse.y + R) / ch));
      for (let j = j0; j <= j1; j++) {
        const dy = (j + 0.5) * ch - mouse.y;
        for (let i = i0; i <= i1; i++) {
          const dx = (i + 0.5) * cw - mouse.x;
          Hall[j * cols + i] += mouse.s * 30 * Math.exp(-(dx * dx + dy * dy) / 9000);
        }
      }
    }
    const rippling = waves.length > 0;
    if (rippling) {
      Hwave.fill(0);
      for (const w of waves) {
        const age = now - w.t0, front = SPEED * age, amp = 11 * Math.exp(-age * 0.8);
        const inner = Math.max(0, front - 420), outer = front + 140;
        const in2 = inner * inner, out2 = outer * outer;
        for (let j = 0, idx = 0; j < rows; j++) {
          const dy = (j + 0.5) * ch - w.y, dy2 = dy * dy;
          if (dy2 > out2) { idx += cols; continue; }
          for (let i = 0; i < cols; i++, idx++) {
            const dx = (i + 0.5) * cw - w.x, r2 = dx * dx + dy2;
            if (r2 < in2 || r2 > out2) continue;
            const d = Math.sqrt(r2) - front;
            const h = amp * Math.exp(-d * d / 9000) * Math.cos(d * 0.085);
            Hwave[idx] += h;
            Hall[idx] += h;
          }
        }
      }
    }

    // backgrounds: switch on schedule, dissolving cell by cell; both run while they overlap. The
    // schedule keeps wall-clock time, so slow frames (capped dt) and reduced motion don't stretch it
    const wall = ms / 1000;
    if (!nextName && wall > sceneUntil) { nextName = pick(sceneName); fadeT0 = wall; label(); }
    let fade = 0;
    if (nextName) {
      fade = (wall - fadeT0) / FADE_SECS;
      if (fade >= 1) { sceneName = nextName; nextName = null; fade = 0; sceneUntil = wall + SCENE_SECS; label(); }
    }
    const cur = SCENES[sceneName], nxt = nextName && SCENES[nextName];
    cur.prep(dt);
    if (nxt) nxt.prep(dt);

    // 2. paint the background: base, then each reveal circle on top
    ctx.globalAlpha = 1;
    ctx.fillStyle = base.bg;
    ctx.fillRect(0, 0, W, H);
    for (const rv of reveals) {
      ctx.fillStyle = rv.pal.bg;
      ctx.beginPath(); ctx.arc(rv.x, rv.y, rv.rad, 0, Math.PI * 2); ctx.fill();
    }

    const exX = -tiltX * 3.4, exY = -tiltY * 1.8;   // extrusion vector, in cells
    const inverted = [];

    // 3. every cell looks through the surface: refraction picks what it shows, the normal picks how bright
    for (let j = 0, idx = 0; j < rows; j++) {
      const py = (j + 0.5) * ch;
      for (let i = 0; i < cols; i++, idx++) {
        const px = (i + 0.5) * cw;
        const l = i > 0 ? idx - 1 : idx, r = i < cols - 1 ? idx + 1 : idx;
        const u = j > 0 ? idx - cols : idx, d = j < rows - 1 ? idx + cols : idx;
        const gx = (Hall[r] - Hall[l]) / (2 * cw), gy = (Hall[d] - Hall[u]) / (2 * ch);
        const spec = (-gx * LX - gy * LY + LZ) / Math.sqrt(gx * gx + gy * gy + 1) - LZ;

        let chr = ' ', b = 0;

        // small text only moves with ripples, so links stay put under a finger or cursor
        let tIdx = idx;
        if (rippling) {
          const tu = Math.round(i - (Hwave[r] - Hwave[l]) / (2 * cw) * 22 / cw);
          const tv = Math.round(j - (Hwave[d] - Hwave[u]) / (2 * ch) * 22 / ch);
          tIdx = tu >= 0 && tv >= 0 && tu < cols && tv < rows ? tv * cols + tu : -1;
        }
        const t = tIdx >= 0 ? textGrid[tIdx] : null;

        if (t !== null) {
          if (hitGrid[tIdx] >= 0 && hitGrid[tIdx] === hover) inverted.push(i, j, t);
          else { chr = t; b = styleGrid[tIdx]; }
        } else {
          const su = i + 0.5 - gx * 40 / cw, sv = j + 0.5 - gy * 40 / ch;
          if (maskAt(su, sv)) {
            // the name is set in bits, each flipping on its own slow clock; faces turned from the light dim
            chr = hash(i, j + Math.floor(now * 1.2 + hash(j, i) * 9)) < 0.5 ? '0' : '1';
            b = spec < -0.06 ? 2 : HEAD;
          } else {
            let k = 1;
            while (k <= DEPTH && !maskAt(su - exX * k / DEPTH, sv - exY * k / DEPTH)) k++;
            if (k <= DEPTH) {
              chr = SIDE[k];
              b = k <= 2 ? 1 : 0;
            } else if (!calm[idx]) {
              cb = 0;
              chr = (nxt && thr[idx] < fade ? nxt : cur).cell(i, j, idx, px, py, spec, l, r, u, d, gx, gy);
              b = cb;
            }
          }
        }

        if (chr !== ' ') {
          const p = reveals.length ? layerAt(px, py) : 0;
          bufs[p][b][i] = chr;
          used[p][b] = 1;
        }
      }

      for (let p = 0; p <= reveals.length; p++) {
        for (let b = 0; b < STYLES.length; b++) {
          if (!used[p][b]) continue;
          const st = STYLES[b];
          ctx.globalAlpha = st.a;
          ctx.fillStyle = layerPal(p)[st.c || 'fg'];
          if (b > 2) ctx.font = fonts[b];
          ctx.fillText(bufs[p][b].join(''), 0, j * ch);
          if (b > 2) ctx.font = fonts[0];
          bufs[p][b].fill(' ');
          used[p][b] = 0;
        }
      }
    }

    // 4. the hovered or focused link, inverted
    ctx.globalAlpha = 1;
    for (let k = 0; k < inverted.length; k += 3) {
      const i = inverted[k], j = inverted[k + 1];
      const p = layerPal(layerAt((i + 0.5) * cw, (j + 0.5) * ch));
      ctx.fillStyle = p.ac;
      ctx.fillRect(i * cw - 0.5, j * ch, cw + 1, ch);
      ctx.fillStyle = p.bg;
      ctx.font = fonts[LINK];
      ctx.fillText(inverted[k + 2], i * cw, j * ch);
      ctx.font = fonts[0];
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
